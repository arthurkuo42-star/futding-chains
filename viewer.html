<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>富鼎分會 第16屆產業服務鏈分組（檢視版）</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
@page { size: A3 landscape; margin: 6mm; }
body {
  font-family: "Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;
  background: #FDFAF2; color: #2A1F00; padding: 6mm;
}
/* ── 載入狀態列 ── */
#status-bar {
  background: linear-gradient(135deg,#7A5200,#B8820A 30%,#E8B420 50%,#B8820A 70%,#7A5200);
  border-radius: 6pt; padding: 6px 14px; margin-bottom: 3mm;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: 11px; color: #FFF8DC;
}
#status-bar .status-left { display: flex; align-items: center; gap: 8px; }
#status-bar .badge {
  background: rgba(0,0,0,0.2); border-radius: 4px;
  padding: 2px 8px; font-size: 10px; color: rgba(255,248,220,0.8);
}
#status-bar a.edit-link {
  color: #FFF8DC; font-size: 11px; text-decoration: none;
  background: rgba(0,0,0,0.2); padding: 3px 10px; border-radius: 4px;
  border: 1px solid rgba(255,248,220,0.3);
}
#status-bar a.edit-link:hover { background: rgba(0,0,0,0.35); }
@media print { #status-bar { display: none; } }

/* ── 頂部橫幅 ── */
.top-banner {
  background: linear-gradient(135deg,#7A5200 0%,#B8820A 25%,#E8B420 50%,#B8820A 75%,#7A5200 100%);
  border-radius: 6pt; padding: 2mm 4mm; margin-bottom: 2.5mm;
  display: flex; align-items: center; justify-content: space-between; gap: 4mm;
}
.diamond { color: #FFF8DC; font-size: 13pt; flex-shrink: 0; letter-spacing: 2pt; }
.main-title { flex: 1; text-align: center; }
.main-title h1 { font-size: 16pt; font-weight: 700; color: #FFF8DC; letter-spacing: 1.5pt; line-height: 1.2; }
.main-title .subtitle { font-size: 8pt; color: rgba(255,248,220,0.75); margin-top: 1.5pt; }
.slogan-box {
  background: rgba(255,255,255,0.18); border: 1pt solid rgba(255,248,220,0.5);
  border-radius: 5pt; padding: 2.5mm 5mm; text-align: center; min-width: 88mm; flex-shrink: 0;
}
.slogan-line1 { font-size: 13.5pt; font-weight: 700; color: #FFF8DC; letter-spacing: 3pt; line-height: 1.3; }
.slogan-line2 { font-size: 9.5pt; font-weight: 500; color: rgba(255,248,220,0.85); letter-spacing: 1.5pt; margin-top: 1pt; }
.gold-rule {
  height: 0.6pt;
  background: linear-gradient(90deg,transparent,#C8971C 15%,#FFD700 50%,#C8971C 85%,transparent);
  margin-bottom: 2.5mm;
}
/* ── 卡片格 ── */
.grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 2.5mm; align-items: start; }
.card { border-radius: 6pt; border: 0.8pt solid #DFC878; background: #FFFDF5; overflow: hidden; box-shadow: 0 1pt 5pt rgba(180,130,0,0.1); }
.card-head { padding: 2.5mm 3.5mm 2mm; border-bottom: 0.5pt solid #E8D090; }
.card-head-name { font-size: 11.5pt; font-weight: 700; line-height: 1.2; letter-spacing: 0.3pt; }
.card-head-aud { font-size: 7pt; margin-top: 1.5pt; line-height: 1.4; }
.card-body { padding: 2mm 3mm 2.5mm; }
.group-sep { border: none; border-top: 0.5pt solid #EAD88A; margin: 2pt 0; }
.group-label { font-size: 6.5pt; font-weight: 700; letter-spacing: 0.8pt; text-transform: uppercase; margin-bottom: 1.5pt; }
.group-row { display: grid; grid-template-columns: 1fr 0.5pt 1fr; gap: 0 3.5pt; align-items: start; }
.col-divider { background: #E8D090; align-self: stretch; }
.member-item { display: flex; align-items: flex-start; gap: 3pt; margin-bottom: 2.5pt; }
.m-dot { width: 5pt; height: 5pt; border-radius: 50%; flex-shrink: 0; margin-top: 3.5pt; }
.m-name { font-size: 13pt; font-weight: 700; line-height: 1.25; }
.m-role { font-size: 8pt; line-height: 1.3; }
.collab-item { display: flex; align-items: flex-start; gap: 2.5pt; margin-bottom: 2.5pt; }
.collab-o { font-size: 7pt; flex-shrink: 0; margin-top: 2pt; line-height: 1; }
.collab-name { font-size: 10.5pt; font-weight: 700; line-height: 1.32; }
.collab-section-label { font-size: 6.5pt; font-weight: 700; letter-spacing: 0.8pt; text-transform: uppercase; margin-bottom: 2pt; opacity: 0.5; }
.footer { text-align: center; padding: 2mm 0 0; font-size: 7.5pt; color: #A08830; letter-spacing: 1.5pt; }

/* ── Accent colours ── */
.ac-purple { border-color: #B8A0E0; }
.ac-purple .card-head { background: linear-gradient(135deg,#F0EBFF,#F5F0FF); }
.ac-purple .card-head-name { color: #3D2878; } .ac-purple .card-head-aud { color: #7060A8; }
.ac-purple .m-dot { background: #7060C8; } .ac-purple .m-name { color: #2A1A60; } .ac-purple .m-role { color: #2E1E6A; }
.ac-purple .group-label { color: #9080B8; } .ac-purple .collab-o { color: #C0B0E0; } .ac-purple .collab-name { color: #A898CC; }
.ac-coral { border-color: #E0A890; }
.ac-coral .card-head { background: linear-gradient(135deg,#FFF0EA,#FFF5F0); }
.ac-coral .card-head-name { color: #7A2A10; } .ac-coral .card-head-aud { color: #AA5030; }
.ac-coral .m-dot { background: #C84820; } .ac-coral .m-name { color: #601808; } .ac-coral .m-role { color: #5A1A00; }
.ac-coral .group-label { color: #C07050; } .ac-coral .collab-o { color: #E0B8A0; } .ac-coral .collab-name { color: #C89880; }
.ac-amber { border-color: #D4A820; }
.ac-amber .card-head { background: linear-gradient(135deg,#FFF7DC,#FFFAEC); }
.ac-amber .card-head-name { color: #5A3800; } .ac-amber .card-head-aud { color: #8A5800; }
.ac-amber .m-dot { background: #B88A00; } .ac-amber .m-name { color: #3A2000; } .ac-amber .m-role { color: #462C00; }
.ac-amber .group-label { color: #A07800; } .ac-amber .collab-o { color: #D4B840; } .ac-amber .collab-name { color: #B89820; }
.ac-teal { border-color: #70C0A0; }
.ac-teal .card-head { background: linear-gradient(135deg,#E8F8F0,#F0FAF5); }
.ac-teal .card-head-name { color: #085040; } .ac-teal .card-head-aud { color: #207860; }
.ac-teal .m-dot { background: #108870; } .ac-teal .m-name { color: #043830; } .ac-teal .m-role { color: #053828; }
.ac-teal .group-label { color: #308870; } .ac-teal .collab-o { color: #90D8B8; } .ac-teal .collab-name { color: #70B898; }
.ac-green { border-color: #88C060; }
.ac-green .card-head { background: linear-gradient(135deg,#EDF7E0,#F3FAE8); }
.ac-green .card-head-name { color: #204A08; } .ac-green .card-head-aud { color: #3A6818; }
.ac-green .m-dot { background: #448820; } .ac-green .m-name { color: #143004; } .ac-green .m-role { color: #1A3808; }
.ac-green .group-label { color: #508828; } .ac-green .collab-o { color: #AAD878; } .ac-green .collab-name { color: #88B858; }
.ac-pink { border-color: #E098B8; }
.ac-pink .card-head { background: linear-gradient(135deg,#FFF0F5,#FFF5F8); }
.ac-pink .card-head-name { color: #6A1840; } .ac-pink .card-head-aud { color: #A03868; }
.ac-pink .m-dot { background: #C03870; } .ac-pink .m-name { color: #480E28; } .ac-pink .m-role { color: #540E30; }
.ac-pink .group-label { color: #C06080; } .ac-pink .collab-o { color: #E8B0CC; } .ac-pink .collab-name { color: #CC88A8; }
.ac-gray { border-color: #C0B090; }
.ac-gray .card-head { background: linear-gradient(135deg,#F5F2E8,#FAF8F0); }
.ac-gray .card-head-name { color: #302818; } .ac-gray .card-head-aud { color: #685840; }
.ac-gray .m-dot { background: #806848; } .ac-gray .m-name { color: #201808; } .ac-gray .m-role { color: #2E2010; }
.ac-gray .group-label { color: #907858; } .ac-gray .collab-o { color: #C8B888; } .ac-gray .collab-name { color: #A89868; }
.ac-blue { border-color: #90B8E0; }
.ac-blue .card-head { background: linear-gradient(135deg,#EAF3FF,#F0F7FF); }
.ac-blue .card-head-name { color: #0C3878; } .ac-blue .card-head-aud { color: #2858A8; }
.ac-blue .m-dot { background: #1858B8; } .ac-blue .m-name { color: #082048; } .ac-blue .m-role { color: #0A2458; }
.ac-blue .group-label { color: #3870B8; } .ac-blue .collab-o { color: #A8C8E8; } .ac-blue .collab-name { color: #88A8D0; }

/* ── 載入中動畫 ── */
#loading {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(253,250,242,0.92); display: flex;
  align-items: center; justify-content: center; z-index: 999;
  flex-direction: column; gap: 12px; font-size: 14px; color: #8A6200;
}
.spinner {
  width: 32px; height: 32px; border: 3px solid #E8D090;
  border-top-color: #C8971C; border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ══ 手機 RWD ══ */
@media (max-width: 768px) {
  body { padding: 3mm; }

  /* 橫幅縮排 */
  .top-banner { flex-direction: column; gap: 2mm; padding: 3mm; text-align: center; }
  .main-title h1 { font-size: 13pt; letter-spacing: 0.5pt; }
  .slogan-box { min-width: unset; width: 100%; }
  .slogan-line1 { font-size: 11pt; letter-spacing: 1.5pt; }
  .slogan-line2 { font-size: 8.5pt; }
  .diamond { display: none; }

  /* 卡片：改成單欄 */
  .grid { grid-template-columns: 1fr; gap: 2.5mm; }

  /* 卡片標頭：可點擊折疊 */
  .card-head {
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    padding: 3mm 3.5mm;
    user-select: none;
  }
  .card-head-text { flex: 1; }
  .card-head-name { font-size: 13pt; }
  .card-head-aud  { font-size: 8pt; margin-top: 2pt; }
  .toggle-arrow {
    font-size: 14px;
    color: rgba(255,255,255,0.6);
    flex-shrink: 0;
    margin-top: 3px;
    transition: transform 0.25s;
    line-height: 1;
  }
  .card.open .toggle-arrow { transform: rotate(180deg); }

  /* 內容預設隱藏，open 時展開 */
  .card-body { display: none; }
  .card.open .card-body { display: block; }

  /* 小組左右欄改成上下排列 */
  .group-row {
    grid-template-columns: 1fr;
    gap: 4pt 0;
  }
  .col-divider {
    height: 0.5pt;
    width: 100%;
    background: #E8D090;
    margin: 4pt 0;
  }

  /* 字體放大適配手機 */
  .m-name  { font-size: 14pt; }
  .m-role  { font-size: 9pt; }
  .collab-name { font-size: 11pt; }
  .group-label { font-size: 7.5pt; }
  .collab-section-label { font-size: 7.5pt; }

  /* 狀態列縮排 */
  #status-bar { flex-wrap: wrap; font-size: 10px; padding: 5px 10px; }
  #status-bar .badge { font-size: 9px; }

  /* 展開提示文字 */
  .tap-hint {
    display: block;
    text-align: center;
    font-size: 10px;
    color: rgba(255,248,220,0.55);
    margin-top: 2mm;
    letter-spacing: 0.3pt;
  }
  .gold-rule { margin-bottom: 2mm; }
  .footer { font-size: 8pt; padding: 3mm 0; }
}

/* 桌機：隱藏手機元素 */
@media (min-width: 769px) {
  .tap-hint { display: none; }
  .toggle-arrow { display: none; }
  .card-body { display: block !important; }
  .card-head { cursor: default; }
}

/* ══ 匯出圖片按鈕 ══ */
.btn-export {
  background: linear-gradient(135deg, #B8820A, #E8B420);
  color: #1A1000;
  border: none;
  padding: 5px 13px;
  border-radius: 5px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  font-family: "Microsoft JhengHei", sans-serif;
}
.btn-export:hover { opacity: 0.88; }
.btn-export:disabled { opacity: 0.5; cursor: not-allowed; }

/* 匯出進度遮罩 */
#export-overlay {
  display: none;
  position: fixed; top:0; left:0; right:0; bottom:0;
  background: rgba(253,250,242,0.92);
  z-index: 99999;
  align-items: center; justify-content: center;
  flex-direction: column; gap: 14px;
}
#export-overlay.show { display: flex; }
#export-overlay .exp-spinner {
  width: 36px; height: 36px;
  border: 3px solid #E8D090; border-top-color: #C8971C;
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
#export-overlay .exp-msg {
  font-size: 14px; color: #8A6200;
  font-family: "Microsoft JhengHei", sans-serif;
}
#export-overlay .exp-sub {
  font-size: 11px; color: #B8A060;
  font-family: "Microsoft JhengHei", sans-serif;
}

/* ══════════ A4 直立海報（離屏渲染，匯出時才顯示） ══════════ */
#poster-a4 {
  display: none;
  position: absolute; left: -99999px; top: 0;
  width: 840px;                 /* 基準寬，匯出時 html2canvas scale 放大到 300dpi */
  min-height: 1188px;           /* A4 比例 1:1.414 */
  background: #FEFCF6;
  padding: 20px 20px 0;
  font-family: "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  color: #2A1F00;
}
#poster-a4.pa4-visible { display: block; }
/* 頂部品牌區 */
.pa4-header { display: flex; align-items: stretch; gap: 12px; margin-bottom: 12px; }
.pa4-logo {
  position: relative; width: 128px; flex-shrink: 0;
  background: linear-gradient(135deg,#9A1B1B,#C0272D);
  clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%);
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px 0 0 8px; overflow: hidden;
}
.pa4-logo::after {
  content:""; position:absolute; top:0; bottom:0; right:10%; width:2px;
  background: linear-gradient(180deg,transparent,#E8C86A,#F0D89A,#E8C86A,transparent);
  transform: skewX(-9deg);
}
.pa4-logo b { color:#FFF; font-size:38px; font-weight:900; letter-spacing:1px; z-index:1; }
.pa4-titlewrap { flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; }
.pa4-titlewrap h1 { font-size:29px; font-weight:900; color:#5A3B0A; letter-spacing:2px; line-height:1.15; }
.pa4-titlewrap .pa4-sub2 { font-size:15px; font-weight:700; color:#8A6412; letter-spacing:3px; margin-top:2px; }
.pa4-legend { font-size:10.5px; color:#9A7A2A; margin-top:5px; letter-spacing:0.5px; }
.pa4-legend b { color:#5A3B0A; } .pa4-legend .pa4-o { color:#C0A860; }
.pa4-slogan {
  width: 172px; flex-shrink:0; border-radius:8px; padding:10px 8px;
  background: linear-gradient(135deg,#6B4A0A,#9A6E14 45%,#7A560E);
  border:1.5px solid #E8C86A; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center;
}
.pa4-slogan .s1 { font-size:16px; font-weight:900; color:#FFF6D8; letter-spacing:3px; line-height:1.3; }
.pa4-slogan .s2 { font-size:10.5px; font-weight:600; color:#F0D89A; letter-spacing:1px; margin-top:3px; }
/* 九宮格 */
.pa4-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; align-items:start; }
.pa4-card {
  border:1.5px solid var(--bd); border-radius:12px; overflow:hidden; background:#FFF;
  box-shadow:0 1px 4px rgba(120,80,0,0.08);
}
.pa4-cardhead { background:var(--hd); padding:6px 9px; display:flex; align-items:center; gap:6px; }
.pa4-num { font-size:17px; font-weight:900; color:rgba(255,255,255,0.9); font-family:"Arial Black",sans-serif; line-height:1; }
.pa4-htext { flex:1; min-width:0; }
.pa4-hname { font-size:14.5px; font-weight:900; color:#FFF; line-height:1.15; letter-spacing:0.3px; }
.pa4-haud { font-size:8.5px; color:rgba(255,255,255,0.82); line-height:1.2; margin-top:1px; }
.pa4-hicon { flex-shrink:0; width:22px; height:22px; }
.pa4-hicon svg { width:22px; height:22px; stroke:#FFF; fill:none; stroke-width:1.7; }
.pa4-cardbody { padding:7px 9px 8px; }
.pa4-grp + .pa4-grp { border-top:1px solid var(--bd); margin-top:5px; padding-top:5px; }
.pa4-glabel { font-size:8.5px; font-weight:700; color:var(--sub); letter-spacing:0.5px; margin-bottom:3px; }
.pa4-cols { display:grid; grid-template-columns:1fr 1px 0.92fr; gap:0 7px; }
.pa4-vdiv { background:var(--bd); align-self:stretch; }
.pa4-mrow { display:flex; align-items:flex-start; gap:4px; margin-bottom:3px; }
.pa4-mdot { width:5px; height:5px; border-radius:50%; background:var(--hd); flex-shrink:0; margin-top:5px; }
.pa4-mname { font-size:13px; font-weight:700; color:var(--tx); line-height:1.2; }
.pa4-mrole { font-size:8.5px; color:var(--sub); line-height:1.15; }
.pa4-clabel { font-size:8px; font-weight:700; color:var(--sub); opacity:0.75; letter-spacing:0.5px; margin-bottom:2px; }
.pa4-crow { display:flex; align-items:flex-start; gap:3px; margin-bottom:2.5px; }
.pa4-co { font-size:7px; color:var(--sub); margin-top:2px; flex-shrink:0; }
.pa4-cname { font-size:9.5px; font-weight:600; color:var(--sub); line-height:1.25; }
/* 底部品牌帶 */
.pa4-footer {
  margin:11px -20px 0; padding:11px 24px;
  background: linear-gradient(90deg,#8A1420,#B0202C 50%,#8A1420);
  display:flex; align-items:center; justify-content:center; gap:14px;
}
.pa4-footer .node { color:#E8C86A; font-size:13px; letter-spacing:2px; }
.pa4-footer .fname { color:#FFF6E0; font-size:13.5px; font-weight:700; letter-spacing:4px; }
/* 九組識別色 */
.pa4-c1 { --hd:#3D2878; --tx:#241660; --sub:#7C6CB0; --bd:#C4B2E4; }
.pa4-c2 { --hd:#B03418; --tx:#5A1608; --sub:#BE7658; --bd:#E6B29C; }
.pa4-c3 { --hd:#3F5510; --tx:#26330A; --sub:#7C8C4A; --bd:#BCCE86; }
.pa4-c4 { --hd:#7A1840; --tx:#450A26; --sub:#BC6488; --bd:#E6A0C0; }
.pa4-c5 { --hd:#4A3520; --tx:#241608; --sub:#96795A; --bd:#CBB48E; }
.pa4-c6 { --hd:#085040; --tx:#043228; --sub:#4A9A82; --bd:#84C8B0; }
.pa4-c7 { --hd:#0C3878; --tx:#071E44; --sub:#5A7CB4; --bd:#98BEE8; }
.pa4-c8 { --hd:#6A1840; --tx:#3E0A24; --sub:#B26488; --bd:#E2A6C2; }
.pa4-c9 { --hd:#6B4A00; --tx:#3A2600; --sub:#A88C42; --bd:#DCBE68; }
</style>
</head>
<body>


<!-- 匯出進度遮罩 -->
<div id="export-overlay">
  <div class="exp-spinner"></div>
  <div class="exp-msg" id="exp-msg">正在產生高解析圖片…</div>
  <div class="exp-sub">請稍候，圖片較大需要幾秒鐘</div>
</div>
<div id="loading"><div class="spinner"></div>載入最新資料中…</div>

<!-- 狀態列 -->
<div id="status-bar">
  <div class="status-left">
    <span>👁 檢視模式</span>
    <span class="badge" id="update-time">載入中…</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
    <button class="btn-export" id="export-btn-a4" onclick="exportA4Portrait()">📄 A4 直立海報</button>
    <button class="btn-export" id="export-btn" onclick="exportImage(false)">📷 匯出高解析圖片</button>
    <button class="btn-export" id="export-btn-members" onclick="exportImage(true)">👥 匯出會員名單圖片</button>
    <a class="edit-link" href="./index.html">✏️ 前往編輯版</a>
  </div>
</div>

<!-- 頂部橫幅 -->
<div class="top-banner">
  <div class="diamond">◆◇◆</div>

const DOT_COLORS = {
  'ac-purple':'#7060C8','ac-coral':'#C84820','ac-amber':'#B88A00',
  'ac-teal':'#108870','ac-green':'#448820','ac-pink':'#C03870',
  'ac-gray':'#806848','ac-blue':'#1858B8'
};
function dotColor(ac) { return DOT_COLORS[ac] || '#B88A00'; }

// ── 建立會員行（唯讀）──
function makeMemberRow(name, role, dc) {
  const row = document.createElement('div');
  row.className = 'member-item';
  const dot = document.createElement('div');
  dot.className = 'm-dot'; dot.style.background = dc;
  const txt = document.createElement('div');
  const n = document.createElement('div'); n.className = 'm-name'; n.textContent = name;
  const r = document.createElement('div'); r.className = 'm-role'; r.textContent = role;
  txt.appendChild(n); txt.appendChild(r);
  row.appendChild(dot); row.appendChild(txt);
  return row;
}

// ── 建立合作行（唯讀）──
function makeCollabRow(text) {
  const row = document.createElement('div');
  row.className = 'collab-item';
  const o = document.createElement('div'); o.className = 'collab-o'; o.textContent = '○';
  const t = document.createElement('div'); t.className = 'collab-name'; t.textContent = text;
  row.appendChild(o); row.appendChild(t);
  return row;
}

// ── 建立卡片（唯讀）──
function buildCard(chain) {
  const card = document.createElement('div');
  card.className = 'card ' + chain.ac;
  const dc = dotColor(chain.ac);

  const head = document.createElement('div'); head.className = 'card-head';

  // 文字區塊
  const headText = document.createElement('div'); headText.className = 'card-head-text';
  const nm  = document.createElement('div'); nm.className  = 'card-head-name'; nm.textContent = chain.name;
  const aud = document.createElement('div'); aud.className = 'card-head-aud';  aud.textContent = chain.aud;
  headText.appendChild(nm); headText.appendChild(aud);

  // 折疊箭頭（手機才顯示）
  const arrow = document.createElement('span'); arrow.className = 'toggle-arrow'; arrow.textContent = '▼';

  head.appendChild(headText); head.appendChild(arrow);

  // 點擊標頭折疊／展開（只在手機有效）
  head.addEventListener('click', () => {
    if (window.innerWidth <= 768) card.classList.toggle('open');
  });

  card.appendChild(head);

  const body = document.createElement('div'); body.className = 'card-body';

  chain.groups.forEach((grp, gi) => {
    if (gi > 0) { const sep = document.createElement('hr'); sep.className = 'group-sep'; body.appendChild(sep); }
    if (grp.label) {
      const lbl = document.createElement('div');
      lbl.className = 'group-label'; lbl.textContent = grp.label;
      body.appendChild(lbl);
    }
    const row = document.createElement('div'); row.className = 'group-row';

    const left = document.createElement('div');
    grp.members.forEach(([n,r]) => left.appendChild(makeMemberRow(n, r, dc)));

    const div = document.createElement('div'); div.className = 'col-divider';

    const right = document.createElement('div');
    const collabLabel = document.createElement('div');
    collabLabel.className = 'collab-section-label'; collabLabel.textContent = '招募專業別';
    right.appendChild(collabLabel);
    grp.collab.forEach(c => right.appendChild(makeCollabRow(c)));

    row.appendChild(left); row.appendChild(div); row.appendChild(right);
    body.appendChild(row);
  });

  card.appendChild(body);
  return card;
}

// ── 全頁渲染 ──
function renderAll(data) {
  window.__chainsData = data;   // 供 A4 直立海報匯出使用
  document.getElementById('poster-title').textContent   = data.title    || '';
  document.getElementById('poster-subtitle').textContent= data.subtitle || '';
  document.getElementById('slogan1').textContent         = data.slogan1  || '';
  document.getElementById('slogan2').textContent         = data.slogan2  || '';
  document.getElementById('poster-footer').textContent  = data.footer   || '';
  const grid = document.getElementById('main-grid');
  grid.innerHTML = '';
  (data.chains || []).forEach(c => grid.appendChild(buildCard(c)));
}

// ── 從雲端載入 ──
async function loadFromCloud() {
  try {
    const res = await fetch(CHAINS_API);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data && data.chains && data.chains.length > 0) {
      renderAll(data);
      // 顯示更新時間（由 index.html 儲存時寫入 data.updatedAt）
      if (data.updatedAt) {
        const d = new Date(data.updatedAt);
        const ts = d.toLocaleDateString('zh-TW') + ' ' + d.toLocaleTimeString('zh-TW', {hour:'2-digit',minute:'2-digit'});
        document.getElementById('update-time').textContent = '最後更新：' + ts;
      } else {
        document.getElementById('update-time').textContent = '已載入雲端資料';
      }
    } else {
      renderAll(DEFAULT_DATA);
      document.getElementById('update-time').textContent = '顯示預設資料';
    }
  } catch(err) {
    renderAll(DEFAULT_DATA);
    document.getElementById('update-time').textContent = '無法連線雲端，顯示預設資料';
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

// 初始化
renderAll(DEFAULT_DATA);
loadFromCloud();

// 手機版：預設展開第一張卡片
function openFirstCard() {
  if (window.innerWidth <= 768) {
    const first = document.querySelector('#main-grid .card');
    if (first) first.classList.add('open');
  }
}
// 每次 renderAll 後重設
const _origRenderAll = renderAll;
window.renderAll = function(data) {
  _origRenderAll(data);
  setTimeout(openFirstCard, 50);
};

          .ac-blue .collab-o { color: #4878C8 !important; }
          .ac-blue .collab-name { color: #1848A0 !important; }

          /* ── 分隔線 ── */
          .group-sep { border-top-color: #CCC !important; }
          .col-divider { background: #CCC !important; }
          .collab-section-label { color: #666 !important; opacity: 1 !important; }

          /* ── 頁尾 ── */
          .footer { color: #666 !important; }

          /* ── 隱藏拖拉把手 ── */
          .drag-handle, .del-btn, .del-chain-btn, .del-group-btn,
          .add-member-btn, .add-collab-btn, .add-group-btn,
          .toggle-arrow, .tap-hint { display: none !important; }
        `;

        // ── 僅會員名單模式：追加額外處理 ──
        if (membersOnly) {
          // 4-1. 追加 CSS：隱藏招募欄位、組內版面改單欄
          style.textContent += `
            .collab-section-label,
            .collab-item,
            .col-divider { display: none !important; }
            .group-row { grid-template-columns: 1fr !important; }
          `;

          // 4-2. 改副標題：只保留「現有夥伴」說明
          const subtitle = clonedDoc.getElementById('poster-subtitle');
          if (subtitle) subtitle.textContent = '● 現有分會夥伴（深色粗體）';

          // 4-3. 移除沒有會員的小組（連同其上方的 group-label / group-sep 一併移除）
          clonedDoc.querySelectorAll('.group-row').forEach(row => {
            const left = row.firstElementChild;
            const hasMembers = left && left.querySelector('.member-item');
            if (!hasMembers) {
              let prev = row.previousElementSibling;
              while (prev && (prev.classList.contains('group-label') || prev.classList.contains('group-sep'))) {
                const toRemove = prev;
                prev = prev.previousElementSibling;
                toRemove.remove();
              }
              row.remove();
            }
          });

          // 4-4. 若整張卡片所有組都被移除，連卡片也隱藏
          clonedDoc.querySelectorAll('.card').forEach(card => {
            if (!card.querySelector('.group-row')) {
              card.style.display = 'none';
            }
          });
        }

        clonedDoc.head.appendChild(style);
      }
    });

    msg.textContent = '調整尺寸為 A4 橫向…';

    // ── 把截圖縮放輸出成 A4 橫向比例 ──
    const outCanvas = document.createElement('canvas');
    outCanvas.width  = A4_W;
    outCanvas.height = A4_H;
    const ctx = outCanvas.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, A4_W, A4_H);

    // 等比例縮放，置中放入 A4
    const srcW = canvas.width;
    const srcH = canvas.height;
    const ratioW = A4_W / srcW;
    const ratioH = A4_H / srcH;
    const ratio  = Math.min(ratioW, ratioH);
    const dstW = Math.round(srcW * ratio);
    const dstH = Math.round(srcH * ratio);
    const dstX = Math.round((A4_W - dstW) / 2);
    const dstY = Math.round((A4_H - dstH) / 2);
    ctx.drawImage(canvas, dstX, dstY, dstW, dstH);

    msg.textContent = '下載中…';
    const link = document.createElement('a');
    const now  = new Date();
    const ts   = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0');
    const suffix = membersOnly ? '_僅會員' : '';
    link.download = '富鼎分會_產業服務鏈' + suffix + '_A4_' + ts + '.png';
    link.href = outCanvas.toDataURL('image/png', 1.0);
    link.click();

  } catch(err) {
    alert('❌ 匯出失敗：' + err.message + '\n\n請改用 Chrome 瀏覽器，或用 F12 → Capture full size screenshot。');
  } finally {
    statusBar.style.display = '';
    overlay.classList.remove('show');
    btns.forEach(b => b.disabled = false);
  }
}

// ══════════ A4 直立海報（紅金企業風、文字全綁雲端資料）══════════
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

// 白色扁平線性圖示（依團隊名關鍵字對應）
const PA4_ICON = {
  building:'<path d="M4 3h16v18H4zM8 7h.5M12 7h.5M16 7h.5M8 11h.5M12 11h.5M16 11h.5M8 15h.5M16 15h.5M10 21v-4h4v4"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.5 1 2.5h6c0-1 .4-1.9 1-2.5A6 6 0 0 0 12 3z"/>',
  food:'<path d="M6 3v6a2 2 0 0 0 4 0V3M8 9v12M16 3c-1.5 0-2 2.2-2 4.5s.6 3.5 2 3.5v10"/>',
  heart:'<path d="M12 21C5 15 3 11 3 7.6A4 4 0 0 1 12 6a4 4 0 0 1 9 1.6C21 11 19 15 12 21z"/>',
  home:'<path d="M3 11l9-7 9 7M5 10v10h14V10"/>',
  diamond:'<path d="M6 3h12l3 6-9 12L3 9z"/>',
  cap:'<path d="M12 4L2 9l10 5 10-5-10-5zM6 11.5V16c0 1.2 3 3 6 3s6-1.8 6-3v-4.5"/>',
  bag:'<path d="M6 8h12l-1 12H7L6 8zM9 8V6a3 3 0 0 1 6 0v2"/>',
  coffee:'<path d="M4 8h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8zM17 9h2a2 2 0 0 1 0 4h-2M8 3v2M12 3v2"/>',
  star:'<path d="M12 3l2.6 6 6.4.5-4.9 4.2 1.5 6.3L12 16.5 6.4 20l1.5-6.3L3 9.5 9.4 9z"/>'
};
function posterIconSvg(name){
  const n = name || '';
  let k = 'star';
  if (/企業|公司|辦公/.test(n)) k='building';
  else if (/品牌|行銷|造夢|設計/.test(n)) k='bulb';
  else if (/餐飲|食品|美食/.test(n)) k='food';
  else if (/健康|生命|醫|長照/.test(n)) k='heart';
  else if (/屋主|居家|房|不動產|修繕/.test(n)) k='home';
  else if (/高資產|資產|財富|理財/.test(n)) k='diamond';
  else if (/教育|菁英|學|升學/.test(n)) k='cap';
  else if (/質威|生活|寵|親子|服飾/.test(n)) k='bag';
  else if (/品味|日常|咖啡|餐/.test(n)) k='coffee';
  return '<svg viewBox="0 0 24 24">'+PA4_ICON[k]+'</svg>';
}

function buildPosterA4(data){
  const chains = data.chains || [];
  const cards = chains.map((c,i)=>{
    const cls = 'pa4-c' + ((i%9)+1);
    const groups = (c.groups||[]).map(g=>{
      const members = (g.members||[]).map(m=>{
        const nm = Array.isArray(m)?m[0]:m.name, ro = Array.isArray(m)?m[1]:m.role;
        return '<div class="pa4-mrow"><div class="pa4-mdot"></div><div><div class="pa4-mname">'+esc(nm)+'</div><div class="pa4-mrole">'+esc(ro)+'</div></div></div>';
      }).join('');
      const collab = (g.collab||[]).map(x=>'<div class="pa4-crow"><span class="pa4-co">○</span><span class="pa4-cname">'+esc(x)+'</span></div>').join('');
      return '<div class="pa4-grp">'+(g.label?'<div class="pa4-glabel">'+esc(g.label)+'</div>':'')+
        '<div class="pa4-cols"><div>'+members+'</div><div class="pa4-vdiv"></div><div><div class="pa4-clabel">招募專業別</div>'+collab+'</div></div></div>';
    }).join('');
    return '<div class="pa4-card '+cls+'"><div class="pa4-cardhead"><span class="pa4-num">'+String(i+1).padStart(2,'0')+
      '</span><div class="pa4-htext"><div class="pa4-hname">'+esc(c.name)+'</div><div class="pa4-haud">'+esc(c.aud||'')+
      '</div></div><span class="pa4-hicon">'+posterIconSvg(c.name)+'</span></div><div class="pa4-cardbody">'+groups+'</div></div>';
  }).join('');
  document.getElementById('poster-a4').innerHTML =
    '<div class="pa4-header"><div class="pa4-logo"><b>BNI</b></div>'+
    '<div class="pa4-titlewrap"><h1>BNI 高雄富鼎分會</h1><div class="pa4-sub2">第16屆　產業服務鏈分組</div>'+
    '<div class="pa4-legend"><b>● 現有分會夥伴</b>　<span class="pa4-o">○ 建議招募合作專業別</span></div></div>'+
    '<div class="pa4-slogan"><div class="s1">富鼎富鼎<br>又富又鼎</div><div class="s2">團隊上百人　引薦破百倍</div></div></div>'+
    '<div class="pa4-grid">'+cards+'</div>'+
    '<div class="pa4-footer"><span class="node">◆◇◆</span><span class="fname">BNI 高雄富鼎分會　第16屆產業服務鏈引薦地圖</span><span class="node">◆◇◆</span></div>';
}

async function exportA4Portrait(){
  const btns = document.querySelectorAll('.btn-export');
  const overlay = document.getElementById('export-overlay');
  const msg = document.getElementById('exp-msg');
  if (typeof html2canvas === 'undefined') { alert('❌ 圖片套件載入失敗，請重新整理頁面後再試。'); return; }
  const poster = document.getElementById('poster-a4');
  btns.forEach(b=>b.disabled=true);
  overlay.classList.add('show');
  msg.textContent = '排版 A4 直立海報中…';
  try {
    buildPosterA4(window.__chainsData || DEFAULT_DATA);
    poster.classList.add('pa4-visible');
    await document.fonts.ready;
    await new Promise(r=>setTimeout(r,300));
    msg.textContent = '產生高解析圖片中…';
    const canvas = await html2canvas(poster, { scale:3, useCORS:true, backgroundColor:'#FEFCF6', logging:false, width:840, windowWidth:900 });
    // 貼進 A4 直立 2480×3508（300dpi），等比置中
    const A4W=2480, A4H=3508;
    const out=document.createElement('canvas'); out.width=A4W; out.height=A4H;
    const ctx=out.getContext('2d'); ctx.fillStyle='#FEFCF6'; ctx.fillRect(0,0,A4W,A4H);
    const ratio=Math.min(A4W/canvas.width, A4H/canvas.height);
    const dw=Math.round(canvas.width*ratio), dh=Math.round(canvas.height*ratio);
    ctx.drawImage(canvas, Math.round((A4W-dw)/2), Math.round((A4H-dh)/2), dw, dh);
    msg.textContent='下載中…';
    const now=new Date(), ts=now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0');
    const link=document.createElement('a');
    link.download='富鼎分會_產業服務鏈_A4直立_'+ts+'.png';
    link.href=out.toDataURL('image/png',1.0); link.click();
  } catch(err){
    alert('❌ 匯出失敗：'+err.message+'\n\n請改用 Chrome 瀏覽器再試。');
  } finally {
    poster.classList.remove('pa4-visible');
    overlay.classList.remove('show');
    btns.forEach(b=>b.disabled=false);
  }
}
